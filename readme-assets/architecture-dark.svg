<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 438" width="840" height="438" role="img" aria-labelledby="ttl dsc">
<title id="ttl">How the pieces fit together</title>
<desc id="dsc">Workload, schedule and seeds feed the engine, which runs the workload under the given schedule and again under a canonical batch-1 schedule. Oracles compare the two bitwise. An internal white-box loop runs through ddmin, a witness artifact and the report; an external black-box loop reads logprobs over HTTP from vLLM or SGLang.</desc>
<defs>
<linearGradient id="gstep" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#B474B4"/><stop offset="1" stop-color="#D0A3D0"/>
</linearGradient>
<linearGradient id="gdrift" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#E87D8F"/><stop offset="1" stop-color="#F2ABB6"/>
</linearGradient>
<linearGradient id="gslate" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#8A8A8A"/><stop offset="1" stop-color="#A9AAAA"/>
</linearGradient>
<linearGradient id="grule" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#4F4F4F"/>
  <stop offset="1" stop-color="#4F4F4F" stop-opacity="0"/>
</linearGradient>
<pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
  <circle cx="1" cy="1" r="0.8" fill="#4F4F4F" opacity="0.5"/>
</pattern>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
  <line x1="0" y1="0" x2="0" y2="7" stroke="#7C7D7D" stroke-width="1.6" opacity="0.42"/>
</pattern>
<pattern id="hatchd" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
  <line x1="0" y1="0" x2="0" y2="7" stroke="#E87D8F" stroke-width="1.6" opacity="0.7"/>
</pattern>
<filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
  <feGaussianBlur stdDeviation="1.6" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
