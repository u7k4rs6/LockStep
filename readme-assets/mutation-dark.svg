<title id="ttl">Mutation campaign, with and without golden bytes</title>
<desc id="dsc">Ten mutation operators. Nine killed by the invariance relations and F1 alone, with the reversed split-combine fold surviving. Ten killed once golden bytes are added as an observer outside the process.</desc>
