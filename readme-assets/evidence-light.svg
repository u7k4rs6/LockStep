<title id="ttl">Committed evidence artifacts and what each backs</title>
<desc id="dsc">Nine committed artifacts under evidence/ and what each one backs, from the relation runs and the fuzz campaign to the three runs the upstream filing rests on. A replay command recomputes a committed trajectory hash on a fresh clone with no GPU.</desc>
