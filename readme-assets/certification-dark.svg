<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 620" width="840" height="620" role="img" aria-labelledby="ttl dsc">
<title id="ttl">vLLM certification across seven boundary cases</title>
<desc id="dsc">Seven boundary cases against vLLM batch-invariant mode: five clean, and two diverged at 44 and 45 co-resident with logprob deltas of 4.685e-02 and 3.906e-02 and no token divergence. The max-num-seqs control restores reproducibility at 8.</desc>
