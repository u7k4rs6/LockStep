<rect x="52.0" y="336.0" width="752.0" height="104.0" rx="8" fill="#4A2F35" stroke="#E87D8F" stroke-width="1"/>
<text x="70.0" y="362.0" font-family="ui-monospace, SFMono-Regular, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#E87D8F" font-weight="700" letter-spacing="2">THE ONE THEY SHARED</text>
<text x="70.0" y="386.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#F3F4F4">three observers with distinct blind spots still share one if all three read a file the engine does not serve from.</text>
<text x="70.0" y="406.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#A9AAAA">I1 to I4, F1 and golden bytes all called model.forward, while every served request goes through forward_batch.</text>
<text x="70.0" y="422.0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#A9AAAA">PATH-EQ closed it: 3 prompts, 730 positions, bitwise, and all four committed digests unchanged by the move.</text>
</svg>
