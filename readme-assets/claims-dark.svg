round" stroke-width="2" d="M 714.0 426.0 l 2.8 3.2 l 5.4 -6.4"/><text x="754" y="430.6" fill="#E87D8F" font-family="ui-monospace, SFMono-Regular, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">7 of 7</text><text x="52" y="484" fill="#7C7D7D" font-family="ui-monospace, SFMono-Regular, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="10.5">every claim is scoped to the environment tuple in env.lock. a claim without one is invalid by construction.</text></svg>