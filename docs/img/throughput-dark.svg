<title id="ttl">Wall time across six configurations, and the kill criterion</title>
<desc id="dsc">Wall time for six configurations, run A solid and run B faded: lockstep fast and invariant, and vLLM default and batch-invariant, each eager and graphed. Below, the 15 percent kill criterion, with the eager comparison at 14.6 and 16.6 percent straddling the bar and the graphed comparison at 10.6 and 11.5 percent consistently below it.</desc>
