<svg xmlns="http://www.w3.org/2000/svg" width="700" height="340" aria-label="Four observers. I1 to I4, F1 and golden bytes all read model.forward, the batch-1 path. The scheduler serves every request through model.forward_batch. PATH-EQ asserts the two agree bitwise at every position." role="img" viewBox="0 0 700 340"><style>.h,.t{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.t{font-size:13px;fill:#e6edf3}.h{font-size:12px;fill:#9198a1}.b,.served{fill:none;stroke:#9198a1;stroke-width:1.5}.served{stroke:#58a6ff;stroke-width:2}.arr{stroke-width:1.5}.arr,.arrs,.gap{fill:none}.gap{stroke-width:1.5;stroke:#db6d28;stroke-dasharray:5 4}.arr{stroke:#9198a1}.arrs{stroke:#58a6ff;stroke-width:2}.lbl{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;fill:#db6d28}</style><defs><marker id="a" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="3"><path fill="#9198a1" d="M0,0 L7,3 L0,6 z"/></marker><marker id="as" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="3"><path fill="#58a6ff" d="M0,0 L7,3 L0,6 z"/></marker></defs><text x="14" y="22" class="h">what each observer actually reads</text><rect width="150" height="26" x="14" y="42" class="b" rx="3"/><text x="24" y="59" class="t">I1 to I4</text><rect width="150" height="26" x="14" y="76" class="b" rx="3"/><text x="24" y="93" class="t">F1</text><rect width="150" height="26" x="14" y="110" class="b" rx="3"/><text x="24" y="127" class="t">golden bytes</text><path marker-end="url(#a)" d="M164,55 L214,55 L214,89 L250,89" class="arr"/><path marker-end="url(#a)" d="M164,89 L250,89" class="arr"/><path marker-end="url(#a)" d="M164,123 L214,123 L214,89 L250,89" class="arr"/><rect width="220" height="30" x="252" y="74" class="b" rx="3"/><text x="262" y="93" class="t">model.forward</text><text x="262" y="118" class="h">the batch-1 contiguous path</text><rect width="472" height="118" x="8" y="30" class="gap" rx="5"/><text x="490" y="60" class="lbl">three observers,</text><text x="490" y="76" class="lbl">one shared blind spot:</text><text x="490" y="92" class="lbl">none of them reads</text><text x="490" y="108" class="lbl">the path that serves</text><rect width="150" height="26" x="14" y="192" class="served" rx="3"/><text x="24" y="209" class="t">the scheduler</text><path marker-end="url(#as)" d="M164,205 L250,205" class="arrs"/><rect width="220" height="30" x="252" y="190" class="served" rx="3"/><text x="262" y="209" class="t">model.forward_batch</text><text x="262" y="234" class="h">every served request goes here</text><rect width="150" height="26" x="14" y="272" class="b" rx="3"/><text x="24" y="289" class="t">PATH-EQ</text><path marker-end="url(#a)" d="M164,285 L250,285" class="arr"/><text x="258" y="282" class="t">asserts the two agree,</text><text x="258" y="298" class="t">bitwise, at every position</text><path stroke-dasharray="4 4" marker-end="url(#a)" d="M382,104 L382,186" class="arr"/><text x="392" y="150" class="h">must be identical</text></svg>