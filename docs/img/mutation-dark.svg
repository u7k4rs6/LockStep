<svg xmlns="http://www.w3.org/2000/svg" width="840" height="416" aria-labelledby="ttl dsc" role="img" viewBox="0 0 840 416"><title id="ttl">Mutation campaign, with and without golden bytes</title><desc id="dsc">Ten mutation operators. Nine killed by the invariance relations and F1 alone, with the reversed split-combine fold surviving. Ten killed once golden bytes are added as an observer outside the process.</desc><defs><linearGradient id="gstep" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#B474B4"/><stop offset="1" stop-color="#D0A3D0"/></linearGradient><linearGradient id="gdrift" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#E87D8F"/><stop offset="1" stop-color="#F2ABB6"/></linearGradient><linearGradient id="gslate" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#8A8A8A"/><stop offset="1" stop-color="#A9AAAA"/></linearGradient><linearGradient id="grule" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#4F4F4F"/><stop offset="1" stop-color="#4F4F4F" stop-opacity="0"/></linearGradient><pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#4F4F4F" opacity=".5"/></pattern><pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" x2="0" y1="0" y2="7" stroke="#7C7D7D" stroke-width="1.6" opacity=".42"/></pattern><pattern id="hatchd" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" x2="0" y1="0" y2="7" stroke="#E87D8F" stroke-width="1.6" opacity=".7"/></pattern><filter id="soft" width="180%" height="180%" x="-40%" y="-40%"><feGaussianBlur result="b" stdDeviation="1.6"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="840" height="416" x="0" y="0" fill="#2C2C2C" stroke="#454545" stroke-width="1" rx="16"/><rect width="838" height="414" x="1" y="1" fill="url(#dots)" opacity=".5" rx="15"/><rect width="7" height="7" x="22" y="26" f