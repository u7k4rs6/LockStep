/><path fill="none" stroke="#B474B4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M 739.8 266.0 l 3.6 4.2 l 7.0 -8.3"/><text x="745" y="298" fill="#B474B4" font-family="ui-monospace, SFMono-Regular, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="8.5" font-weight="700" text-anchor="middle">O9</text><rect width="34" height="34" x="770" y="250" fill="#382C3A" stroke="#B474B4" stroke-width="1.2" rx="7"/><path fill="none" stroke="#B474B4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M 781.8 266.0 l 3.6 4.2 l 7.0 -8.3"/><text x="787" y="298" fill="#B474B4" font-family="ui-monospace, SFMono-Regular, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="8.5" font-weight="700" text-anchor="middle">O10</text><line x1="787" x2="787" y1="190" y2="250" stroke="#E87D8F" stroke-dasharray="3 3" stroke-width="1.2"/><text x="52" y="336" fill="#A9AAAA" font-family="ui-monospace, SFMono-Regular, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="10.5">the one mutant that separates the two rows:</text><text x="304" y="336" fill="#E87D8F" font-family="ui-monospace, SFMono-Regular, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="700">reversed split-combine fold</text><text x="52" y="356" fill="#7C7D7D" font-family="ui-monospace, SFMono-Regular, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="10">every operator fires a sentinel from inside the mutant body, so no trial here is a mutant that never ran. path executed,</text><text x="52" y="371" fill="#7C7D7D" font-family="ui-monospace, SFMono-Regular, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="10">patch executed and fault injected are three claims, and the counters can only tell you about the first.</text></svg>