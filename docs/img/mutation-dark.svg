 sans-serif" font-size="12.5" font-weight="600">invariance relations and F1 only</text><text x="70" y="164" fill="#7C7D7D" font-family="ui-monospace, SFMono-Regular, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="9.5">the fold reversal is not a function of the schedule,</text><text x="70" y="178" fill="#7C7D7D" font-family="ui-monospace, SFMono-Regular, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="9.5">so the engine agrees with itself and both pass</text><rect width="116" height="20" x="70" y="186" fill="#4A2F35" stroke="#E87D8F" stroke-width="1" rx="10"/><text x="128" y="199.6" fill="#E87D8F" font-family="ui-monospace, SFMono-Regular, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">9 of 10 killed</text><rect width="34" height="34" x="392" y="138" fill="#382C3A" stroke="#B474B4" stroke-width="1.2" rx="7"/><path fill="none" stroke="#B474B4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M 403.8 154.0 l 3.6 4.2 l 7.0 -8.3"/><text x="409" y="186" fill="#B474B4" font-family="ui-monospace, SFMono-Regular, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="8.5" font-weight="700" text-anchor="middle">O1</text><rect width="34" height="34" x="434" y="138" fill="#382C3A" stroke="#B474B4" stroke-width="1.2" rx="7"/><path fill="none" stroke="#B474B4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M 445.8 154.0 l 3.6 4.2 l 7.0 -8.3"/><text x="451" y="186" fill="#B474B4" font-family="ui-monospace, SFMono-Regular, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="8.5" font-weight="700" text-anchor="middle">O2</text><rect width="34" height="34" x="476" y="138" fill="#382C3A" stroke="#B474B4" stroke-width="1.2" rx="7"/><path fill="none" stroke="#B474B4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M 487.8 154.0 l 3.6 4.2 l 7.0 -8.3"/><text x="493" y="186" fill="#B474B4" font-famil