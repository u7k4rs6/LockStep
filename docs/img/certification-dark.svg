<svg xmlns="http://www.w3.org/2000/svg" width="840" height="620" aria-labelledby="ttl dsc" role="img" viewBox="0 0 840 620"><title id="ttl">vLLM certification across seven boundary cases</title><desc id="dsc">Seven boundary cases against vLLM batch-invariant mode: five clean, and two diverged at 44 and 45 co-resident with logprob deltas of 4.685e-02 and 3.906e-02 and no token divergence. The max-num-seqs control restores reproducibility at 8.</desc><defs><linearGradient id="gstep" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#B474B4"/><stop offset="1" stop-color="#D0A3D0"/></linearGradient><linearGradient id="gdrift" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#E87D8F"/><stop offset="1" stop-color="#F2ABB6"/></linearGradient><linearGradient id="gslate" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#8A8A8A"/><stop offset="1" stop-color="#A9AAAA"/></linearGradient><linearGradient id="grule" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#4F4F4F"/><stop offset="1" stop-color="#4F4F4F" stop-opacity="0"/></linearGradient><pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#4F4F4F" opacity=".5"/></pattern><pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" x2="0" y1="0" y2="7" stroke="#7C7D7D" stroke-width="1.6" opacity=".42"/></pattern><pattern id="hatchd" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" x2="0" y1="0" y2="7" stroke="#E87D8F" stroke-width="1.6" opacity=".7"/></pattern><filter id="soft" width="180%" height="180%" x="-40%" y="-40%"><feGaussianBlur result="b" stdDeviation="1.6"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="840" height="620" x="0" y="0" fill="#2C2C2C" stroke="#454545" stroke-width="1" rx="16"/><rect width="838" height="618" x="1" y="1" fill="url(#dots)" opacity=".5" rx="15"/><rect width="7" height="7" x="22" y="26" fill="#E87D8F" rx="1.5"/><text x="39" y="33" fill="#E87D8F" font-family="ui-monospace, SFMono-Regular, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="2.2">CERTIFICATION</text><rect width="565.4" height="1" x="152.6" y="29.2" fill="url(#grule)"/><path fill="none" stroke="#B474B4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M 738 30 L 752 30 L 760 22 L 772 22 L 780 30 L 808 30"/><path fill="none" stroke="#E87D8F" stroke-dasharray="1 3.4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M 780 30 L 788 39 L 808 39"/><circle cx="780" cy="30" r="2.8" fill="#E87D8F"/><text x="22" y="68" fill="#F3F4F4" font-family="ui-monospace, SFMono-Regular, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="18" font-weight="700" letter-spacing="-.3">Black-box differential testing of vLLM batch-invariant mode</text><text x="22" y="90" fill="#A9AAAA" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5">concurrent submission, co-residency read from the engine&apos;s own gauge, every pair of repeats compared</text><line x1="28" x2="28" y1="108" y2="564" stroke="#4F4F4F" stroke-width="1" opacity=".9"/><line x1="28" x2="35" y1="108" y2="108" stroke="#4F4F4F" stroke-width="1" opacity=".95"/><line x1="28" x2="32" y1="121" y2="121" stroke="#4F4F4F" stroke-width="1" opacity=".45"/><line x1="28" x2="32" y1="134" y2="134" stroke="#4F4F4F" stroke-width="1" opacity=".45"/><line x1="28" x2="32" y1="147" y2="147" stroke="#4F4F4F" stroke-width="1" opacity=".45"/><line x1="28" x2="35" y1="160" y2="160" stroke="#4F4F4F" stroke-width="1" opacity=".95"/><line x1="28" x2="32" y1="173" y2="173" stroke="#4F4F4F" stroke-width="1" opacity=".45"/><line x1="28" x2="32" y1="186" y2="186" stroke="#4F4F4F" stroke-width="1" opacity=".45"/><line x1="28" x2="32" y1="199" y2="199" stroke="#4F4F4F" stroke-width="1" op