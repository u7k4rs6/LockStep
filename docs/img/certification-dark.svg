 Consolas, monospace" font-size="10">45 co-resident</text><text x="536" y="540" fill="#E87D8F" font-family="ui-monospace, SFMono-Regular, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11">not reproducible, intermittently</text><text x="70" y="560" fill="#7C7D7D" font-family="ui-monospace, SFMono-Regular, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="9.5">intermittent at about one lifetime in three, so which cases trip is not the claim. token ids never move, only logprobs. filed as vllm#51187.</text></svg>