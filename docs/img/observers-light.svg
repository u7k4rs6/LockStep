<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" width="700" height="340" role="img" aria-label="Four observers. I1 to I4, F1 and golden bytes all read model.forward, the batch-1 path. The scheduler serves every request through model.forward_batch. PATH-EQ asserts the two agree bitwise at every position.">
  <style>
    .t { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: #1f2328; }
    .h { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: #59636e; }
    .b { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .served { fill: none; stroke: #0969da; stroke-width: 2; }
    .gap { fill: none; stroke: #bc4c00; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .arr { stroke: #59636e; stroke-width: 1.5; fill: none; }
    .arrs { stroke: #0969da; stroke-width: 2; fill: none; }
    .lbl { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #bc4c00; }
  </style>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#59636e"/>
    </marker>
    <marker id="as" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#0969da"/>
    </marker>
  </defs>

  <text x="14" y="22" class="h">what each observer actually reads</text>

  <rect x="14" y="42" width="150" height="26" rx="3" class="b"/>
  <text x="24" y="59" class="t">I1 to I4</text>
  <rect x="14" y="76" width="150" height="26" rx="3" class="b"/>
  <text x="24" y="93" class="t">F1</text>
  <rect x="14" y="110" width="150" height="26" rx="3" class="b"/>
  <text x="24" y="127" class="t">golden bytes</text>

  <path d="M164,55 L214,55 L214,89 L250,89" class="arr" marker-end="url(#a)"/>
  <path d="M164,89 L250,89" class="arr" marker-end="url(#a)"/>
  <path d="M164,123 L214,123 L214,89 L250,89" class="arr" marker-end="url(#a)"/>

  <rect x="252" y="74" width="220" height="30" rx="3" class="b"/>
  <text x="262" y="93" class="t">model.forward</text>
  <text x="262" y="118" class="h">the batch-1 contiguous path</text>

  <rect x="8" y="30" width="472" height="118" rx="5" class="gap"/>
  <text x="490" y="60" class="lbl">three observers,</text>
  <text x="490" y="76" class="lbl">one shared blind spot:</text>
  <text x="490" y="92" class="lbl">none of them reads</text>
  <text x="490" y="108" class="lbl">the path that serves</text>

  <rect x="14" y="192" width="150" height="26" rx="3" class="served"/>
  <text x="24" y="209" class="t">the scheduler</text>
  <path d="M164,205 L250,205" class="arrs" marker-end="url(#as)"/>
  <rect x="252" y="190" width="220" height="30" rx="3" class="served"/>
  <text x="262" y="209" class="t">model.forward_batch</text>
  <text x="262" y="234" class="h">every served request goes here</text>

  <rect x="14" y="272" width="150" height="26" rx="3" class="b"/>
  <text x="24" y="289" class="t">PATH-EQ</text>
  <path d="M164,285 L250,285" class="arr" marker-end="url(#a)"/>
  <text x="258" y="282" class="t">asserts the two agree,</text>
  <text x="258" y="298" class="t">bitwise, at every position</text>

  <path d="M382,104 L382,186" class="arr" stroke-dasharray="4 4" marker-end="url(#a)"/>
  <text x="392" y="150" class="h">must be identical</text>
</svg>
